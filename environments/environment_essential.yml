name: studentsuccess-essentials
channels:
  - conda-forge
  - defaults

dependencies:
  # Pin a broadly compatible Python (request earlier was 3.10.x)
  - python>=3.11,<3.13
  # Conda packages
  - python-dotenv
  - openpyxl
  - aiohttp>=3.14,<4
  - bokeh>=3.8.2,<4
  - matplotlib=3.10.1
  - numpy=1.26.4
  - pandas=2.2.3
  - plotly=6.0.1
  - pydot=1.4.2
  - openssl=3.6.2  # Temporary Windows workaround for OpenSSL 3.6.3 ASN.1 certificate-store error

 
  - scipy=1.15.2
  # (Optional) If your Markov diagrams need the DOT binary, uncomment:
  - graphviz
  # Pip fallback for packages not reliably available on conda
  # - pip
  # - pip:
      # - census==0.8.21
