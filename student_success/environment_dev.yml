name: student_success_dev
channels:
  - conda-forge
  - defaults

dependencies:
  - pip

  # Core docs & lint
  - docutils=0.20.1
  - flake8=7.1.1

  # Jupyter stack
  - ipykernel=6.29.4
  - ipython=8.25.0
  - ipywidgets=8.1.2
  - jupyter=1.0.0
  - jupyter_console=6.6.3
  - jupyter_client=8.6.2
  - jupyter_core=5.7.2
  - jupyter_server=2.14.1
  - jupyter_server_terminals=0.5.3
  - jupyterlab=4.2.7
  - jupyterlab_server=2.27.3
  - jupyterlab_widgets=3.0.13
  - matplotlib-inline=0.1.7
  - nbclient=0.10.0
  - nbconvert=7.16.4
  - nbformat=5.10.4
  - nbsphinx=0.9.5
  - notebook=7.2.1
  - notebook-shim=0.2.4
  - qtconsole=5.5.1

  # JupyterLab extensions
  - lckr_jupyterlab_variableinspector>=3.2.1  # latest on conda-forge is 3.2.4

  # Sphinx & themes
  - sphinx=7.2.6
  - sphinx-rtd-theme=2.0.0
  - sphinxcontrib-applehelp=1.0.8
  - sphinxcontrib-devhelp=1.0.6
  - sphinxcontrib-htmlhelp=2.0.5
  - sphinxcontrib-jquery=4.1
  - sphinxcontrib-jsmath=1.0.1
  - sphinxcontrib-qthelp=1.0.7
  - sphinxcontrib-serializinghtml=1.1.10
  - recommonmark=0.7.1

  # Misc
  - memory_profiler=0.61.0

  # Packaging tool (conda name is python-build)
  - python-build=1.2.2.post1

  # pip-only (not reliably available on conda-forge at requested versions)
  - pip:
      - flake8-html==0.4.3